services:
  smartway-api:
    build: .
    container_name: smartway-api
    env_file: .env
    ports: ["8080:8080"]
    environment:
      TZ: America/Sao_Paulo
      JAVA_TOOL_OPTIONS: "-Duser.timezone=America/Sao_Paulo"
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://smartway-db:5432/smartway
      SPRING_DATASOURCE_USERNAME: smartway
      SPRING_DATASOURCE_PASSWORD: smartway123
      JWT_SECRET: smartway-secret-key-change-in-production-min32
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
    depends_on:
      smartway-db: { condition: service_healthy }
    networks: [smartway-network]
  smartway-db:
    image: postgres:16-alpine
    container_name: smartway-db
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: smartway
      POSTGRES_USER: smartway
      POSTGRES_PASSWORD: smartway123
    volumes: [smartway-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartway"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [smartway-network]
volumes:
  smartway-data:
networks:
  smartway-network:
    driver: bridge
