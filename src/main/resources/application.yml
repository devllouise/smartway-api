spring:
  application:
    name: smartway-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartway}
    username: ${SPRING_DATASOURCE_USERNAME:smartway}
    password: ${SPRING_DATASOURCE_PASSWORD:smartway123}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:smartway-secret-key-troque-em-producao-min32chars}
  expiration: 86400000

# ========== GOOGLE APIs ==========
google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY}

smartway:
  gemini:
    api-key: ${GEMINI_API_KEY}
    model: gemini-3.1-flash-lite
  vehicle:
    fipe-base-url: https://fipe.parallelum.com.br/api/v2
    # Preco medio por litro (ANP, levantamento semanal). Atualizar periodicamente.
    fuel-price:
      gasoline: ${FUEL_PRICE_GASOLINE:6.30}
      ethanol: ${FUEL_PRICE_ETHANOL:4.40}
      diesel: ${FUEL_PRICE_DIESEL:6.10}
    # Consumo usado quando o usuario nao cadastra veiculo
    default-km-per-liter:
      car: 11.0
      motorcycle: 35.0
  learning:
    min-interactions: 5
    weight-adjustment-rate: 0.10
    habit-min-occurrences: 3

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
